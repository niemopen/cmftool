[versions]
picocli = "4.7.7"
gson = "2.13.2"
commons-io = "2.22.0"
commons-lang3 = "3.20.0"
log4j = "2.24.3"
saxon = "12.5"
xerces = "2.12.2"
xmlresolver = "6.0.14"
xalan = "2.7.3"
javatuples = "1.2"

junit-bom = "5.12.2"
assertj = "3.26.0"
logcaptor = "2.9.3"
mockito = "5.12.0"
json-path = "3.0.0"
json-schema-validator = "3.0.1"
jackson-databind = "2.17.1"

jena = "5.6.0"
logback = "1.5.16"

[libraries]
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

saxon-he = { module = "net.sf.saxon:Saxon-HE", version.ref = "saxon" }
xerces = { module = "xerces:xercesImpl", version.ref = "xerces" }
xmlresolver = { module = "org.xmlresolver:xmlresolver", version.ref = "xmlresolver" }
xalan = { module = "xalan:xalan", version.ref = "xalan" }
xalan-serializer = { module = "xalan:serializer", version.ref = "xalan" }
javatuples = { module = "org.javatuples:javatuples", version.ref = "javatuples" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
logcaptor = { module = "io.github.hakky54:logcaptor", version.ref = "logcaptor" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "json-path" }
json-path-assert = { module = "com.jayway.jsonpath:json-path-assert", version.ref = "json-path" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-databind" }

jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jena" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
